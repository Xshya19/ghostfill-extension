name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable v<version> tag to package and publish
        required: true
        type: string

# Packaging must never have repository write access. The isolated publish job
# receives the minimum permission required to create or update a release.
permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  package:
    name: Package ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Validate requested tag
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tags must use v<semantic-version>; received: $RELEASE_TAG" >&2
            exit 1
          fi
      # v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
      # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 20.x
          cache: npm
      - run: npm ci
      - run: npm run type-check
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run bundle:check
      - run: npm run zip
      - name: Verify version and checksum
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          test "$RELEASE_TAG" = "v$VERSION"
          sha256sum --check "ghostfill-extension-v$VERSION.zip.sha256"
      # v7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ghostfill-public-package-${{ env.RELEASE_TAG }}
          path: |
            ghostfill-extension-v*.zip
            ghostfill-extension-v*.zip.sha256
          if-no-files-found: error

  publish:
    name: Publish ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      # v7
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: ghostfill-public-package-${{ env.RELEASE_TAG }}
          path: release-assets
      - name: Verify downloaded artifact
        working-directory: release-assets
        shell: bash
        run: sha256sum --check "ghostfill-extension-${RELEASE_TAG}.zip.sha256"
      - name: Create or update GitHub Release
        working-directory: release-assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" *.zip *.zip.sha256 --clobber
          else
            gh release create "$RELEASE_TAG" *.zip *.zip.sha256 --title "$RELEASE_TAG" --generate-notes
          fi
