name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20.x
          cache: npm
      - run: npm ci
      - run: npm run type-check
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run bundle:check
      - run: npm run zip
      - name: Verify version tag and checksum
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=$(node -p "require('./package.json').version")
          test "$GITHUB_REF_NAME" = "v$VERSION"
          sha256sum --check "ghostfill-extension-v$VERSION.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ghostfill-public-package
          path: |
            ghostfill-extension-v*.zip
            ghostfill-extension-v*.zip.sha256
          if-no-files-found: error
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh release create "$GITHUB_REF_NAME" "ghostfill-extension-v$VERSION.zip" "ghostfill-extension-v$VERSION.zip.sha256" --title "$GITHUB_REF_NAME" --generate-notes
