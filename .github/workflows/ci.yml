name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Read-only by default. Individual jobs must opt in to broader access.
permissions:
  contents: read

# Avoid spending runners on obsolete commits while keeping the default branch
# serial and easy to diagnose.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node: [20.x, 22.x]
    steps:
      # v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run workflow:check
      - run: npm run type-check
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run bundle:check
      - run: npm run zip
      - name: Verify package checksum
        run: sha256sum --check ghostfill-extension-v*.zip.sha256
