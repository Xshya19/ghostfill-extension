name: Feature request
description: Suggest a focused improvement.
title: 'feature: '
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the user need, not only an implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy and safety
      options:
        - label: This proposal does not require publishing private data or weakening sensitive-site exclusions.
          required: true
